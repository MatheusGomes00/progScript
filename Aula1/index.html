<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula1</title>
    <!-- CDN do vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>  
</head>
<body>
    <div id="app">
        <p>{{titulo}}</p>
        <h1>{{numero1}} + {{numero2}} = {{numero1 * numero2}}</h1>
        <h1>{{numero1}} - {{numero2}} = {{sub(numero1, numero2)}}</h1>
        <h1>{{numero1}} / {{numero2}} = {{div(numero1, numero2)}}</h1>
        <h1>{{numero1}} * {{numero2}} = {{mult(numero1, numero2)}}</h1>
        <h1>Timer: {{timer()}}</h1>
    </div>
</body>
</html>
<script>
    const { createApp } = Vue
    createApp({
        data(){
            return {
                titulo: "Hello world",
                numero1: 10,
                numero2: 25
            }
        },
        methods: {
            sub(x, y){
                return x - y
            },
            div(x, y){
                resultado = (x / y)
                return resultado.toFixed(2)
            },
            mult () {
                x = this.numero1
                y = this.numero2 
                return x * y
            },
            timer(){
                setTimeout(() => {
                    this.numero1 += 1
                }, 1000)
                if (this.numero1 % 2 == 0){
                    return this.numero1 + " Par"
                }else {
                    return this.numero1 + " Impar"
                }
            }
        }
    }).mount("#app")
</script>
